name: Validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Compare the checked-in artifacts before any generation can overwrite drift.
      - run: bun run validate
      - run: bun run verify
      - run: bun run generate --out "${{ runner.temp }}/basile-reproduced"
      - run: bun run validate --out "${{ runner.temp }}/basile-reproduced"
  release:
    name: Publish validated release
    needs: validate
    if: >-
      github.repository == 'davidbasilefilho/basile-agc' &&
      github.event_name == 'push' && github.event.deleted == false &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    concurrency:
      group: basile-agc-release-publication
      queue: max
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --production --ignore-scripts
      # Publish freshly generated files, never separately uploaded hand-built configs.
      - run: bun run validate
      - run: bun run generate
      - run: bun run verify
      - name: Publish and reconcile managed releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run release:ci
